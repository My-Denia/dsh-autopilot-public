<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" fill="none">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1324" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Phase Card Gradients -->
    <linearGradient id="cardInputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>

    <linearGradient id="cardPlanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#08172c" />
    </linearGradient>

    <linearGradient id="cardExecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b2c" />
      <stop offset="100%" stop-color="#081d1e" />
    </linearGradient>

    <linearGradient id="cardCloseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13273e" />
      <stop offset="100%" stop-color="#0b1728" />
    </linearGradient>

    <linearGradient id="cardGateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#111029" />
    </linearGradient>

    <linearGradient id="cardEgressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311907" />
      <stop offset="100%" stop-color="#1c0f05" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="wfDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="410" rx="16" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title Bar -->
  <g transform="translate(36, 24)">
    <text x="0" y="16" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.01em" class="font-sans">dsh-autopilot Governed Execution Loop</text>
    <text x="320" y="16" fill="#64748b" font-size="12" class="font-mono">|</text>
    <text x="334" y="16" fill="#38bdf8" font-size="12" font-weight="600" class="font-mono">Event-Sourced Single Writer Engine</text>
    <text x="590" y="16" fill="#64748b" font-size="12" class="font-mono">|</text>
    <text x="604" y="16" fill="#10b981" font-size="12" font-weight="600" class="font-sans">&#9679; Mechanical Enforcement</text>
  </g>

  <!-- PHASE 1: NATURAL LANGUAGE INPUT & PLANNING -->
  <g transform="translate(36, 68)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="160" height="184" rx="10" fill="url(#cardInputGrad)" stroke="#334155" stroke-width="1.2" />
    <!-- Header -->
    <rect x="0" y="0" width="160" height="28" rx="10" fill="#0f172a" />
    <path d="M 0 18 L 0 28 L 160 28 L 160 18 Z" fill="#0f172a" />
    <text x="10" y="18" fill="#94a3b8" font-size="10.5" font-weight="700" class="font-mono">PHASE 1: INPUT</text>
    
    <!-- Body -->
    <text x="12" y="52" fill="#38bdf8" font-size="12" font-weight="700" class="font-sans">Natural Language</text>
    <rect x="10" y="62" width="140" height="48" rx="6" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="78" fill="#e2e8f0" font-size="9.5" class="font-mono">"Use dsh-autopilot</text>
    <text x="16" y="92" fill="#e2e8f0" font-size="9.5" class="font-mono"> to implement &lt;goal&gt;</text>
    <text x="16" y="104" fill="#e2e8f0" font-size="9.5" class="font-mono"> &amp; verify result."</text>

    <!-- State Init -->
    <text x="12" y="130" fill="#94a3b8" font-size="10.5" class="font-sans">&#8594; <tspan font-weight="600" fill="#f1f5f9">autopilot_plan</tspan></text>
    <text x="12" y="146" fill="#94a3b8" font-size="10.5" class="font-sans">&#8594; <tspan font-weight="600" fill="#f1f5f9">autopilot_usage</tspan></text>
    <rect x="10" y="156" width="140" height="20" rx="4" fill="#082f49" />
    <text x="24" y="170" fill="#38bdf8" font-size="9.5" font-weight="700" class="font-mono">OS Read-Only Active</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="196" y1="160" x2="228" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- PHASE 2: PLAN GATE (INDEPENDENT AUDIT) -->
  <g transform="translate(232, 68)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="156" height="184" rx="10" fill="url(#cardGateGrad)" stroke="#6366f1" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="156" height="28" rx="10" fill="#1e1b4b" />
    <path d="M 0 18 L 0 28 L 156 28 L 156 18 Z" fill="#1e1b4b" />
    <text x="10" y="18" fill="#c7d2fe" font-size="10.5" font-weight="700" class="font-mono">PLAN GATE</text>

    <!-- Body -->
    <text x="12" y="52" fill="#a5b4fc" font-size="12" font-weight="700" class="font-sans">Independent Auditor</text>
    <text x="12" y="68" fill="#94a3b8" font-size="10" class="font-sans">&#9679; One-shot subagent</text>
    <text x="12" y="82" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Read-only tools</text>
    <text x="12" y="96" fill="#94a3b8" font-size="10" class="font-sans">&#9679; maxDepth = 1</text>
    <text x="12" y="110" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Structured schema</text>

    <!-- Gate Conditions Box -->
    <rect x="10" y="122" width="136" height="52" rx="6" fill="#0e0d24" stroke="#3730a3" stroke-width="1" />
    <text x="16" y="138" fill="#e0e7ff" font-size="10" font-weight="600" class="font-mono">Verdict == 'pass'</text>
    <text x="16" y="152" fill="#e0e7ff" font-size="10" font-weight="600" class="font-mono">&amp; usage declared</text>
    <text x="16" y="166" fill="#10b981" font-size="9.5" font-weight="700" class="font-mono">&#10003; Gate Unlocks</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="388" y1="160" x2="420" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)" />

  <!-- PHASE 3: DELEGATED EXECUTOR -->
  <g transform="translate(424, 68)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="168" height="184" rx="10" fill="url(#cardExecGrad)" stroke="#10b981" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="168" height="28" rx="10" fill="#064e3b" />
    <path d="M 0 18 L 0 28 L 168 28 L 168 18 Z" fill="#064e3b" />
    <text x="10" y="18" fill="#a7f3d0" font-size="10.5" font-weight="700" class="font-mono">PHASE 2: EXECUTION</text>

    <!-- Body -->
    <text x="12" y="52" fill="#34d399" font-size="12" font-weight="700" class="font-sans">Delegated Executor</text>
    <text x="12" y="68" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Continuable child agent</text>
    <text x="12" y="82" fill="#94a3b8" font-size="10" class="font-sans">&#9679; CAS generation counter</text>
    <text x="12" y="96" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Bounded 3x turn reminders</text>

    <!-- Same Executor Resume Box -->
    <rect x="10" y="112" width="148" height="62" rx="6" fill="#06241b" stroke="#059669" stroke-width="1" />
    <text x="16" y="128" fill="#6ee7b7" font-size="10.5" font-weight="700" class="font-mono">needs-fix resume</text>
    <text x="16" y="142" fill="#cbd5e1" font-size="9" class="font-sans">Same executor resumes;</text>
    <text x="16" y="154" fill="#cbd5e1" font-size="9" class="font-sans">avoids cold replans &amp;</text>
    <text x="16" y="166" fill="#cbd5e1" font-size="9" class="font-sans">stranded child tasks.</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="592" y1="160" x2="624" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- PHASE 4: EXECUTION GATE (AUDIT 2) -->
  <g transform="translate(628, 68)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="148" height="184" rx="10" fill="url(#cardGateGrad)" stroke="#6366f1" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="148" height="28" rx="10" fill="#1e1b4b" />
    <path d="M 0 18 L 0 28 L 148 28 L 148 18 Z" fill="#1e1b4b" />
    <text x="10" y="18" fill="#c7d2fe" font-size="10.5" font-weight="700" class="font-mono">EXEC GATE</text>

    <!-- Body -->
    <text x="12" y="52" fill="#a5b4fc" font-size="12" font-weight="700" class="font-sans">Execution Audit</text>
    <text x="12" y="68" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Independent reviewer</text>
    <text x="12" y="82" fill="#94a3b8" font-size="10" class="font-sans">&#9679; Binary criteria check</text>
    <text x="12" y="96" fill="#94a3b8" font-size="10" class="font-sans">&#9679; No self-approval</text>

    <rect x="10" y="118" width="128" height="54" rx="6" fill="#0e0d24" stroke="#3730a3" stroke-width="1" />
    <text x="16" y="136" fill="#c7d2fe" font-size="9.5" font-weight="600" class="font-mono">Verdicts:</text>
    <text x="16" y="150" fill="#34d399" font-size="9.5" font-weight="700" class="font-mono">&#10003; pass</text>
    <text x="16" y="164" fill="#f59e0b" font-size="9" class="font-mono">&#8634; needs-fix (resume)</text>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <line x1="776" y1="160" x2="808" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)" />

  <!-- PHASE 5: EVIDENCE-BOUND CLOSEOUT -->
  <g transform="translate(812, 68)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="112" height="184" rx="10" fill="url(#cardCloseGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Header -->
    <rect x="0" y="0" width="112" height="28" rx="10" fill="#082f49" />
    <path d="M 0 18 L 0 28 L 112 28 L 112 18 Z" fill="#082f49" />
    <text x="8" y="18" fill="#7dd3fc" font-size="10.5" font-weight="700" class="font-mono">CLOSEOUT</text>

    <!-- Body -->
    <text x="10" y="52" fill="#38bdf8" font-size="11.5" font-weight="700" class="font-sans">Completed</text>
    <text x="10" y="68" fill="#94a3b8" font-size="9" class="font-sans">&#10003; Dual gates pass</text>
    <text x="10" y="80" fill="#94a3b8" font-size="9" class="font-sans">&#10003; Roles matched</text>
    <text x="10" y="92" fill="#94a3b8" font-size="9" class="font-sans">&#10003; 1:1 Bearers</text>

    <rect x="8" y="112" width="96" height="60" rx="6" fill="#031d2e" stroke="#0369a1" stroke-width="1" />
    <text x="14" y="130" fill="#38bdf8" font-size="9" font-weight="700" class="font-mono">evaluate-</text>
    <text x="14" y="142" fill="#38bdf8" font-size="9" font-weight="700" class="font-mono">Completion()</text>
    <text x="14" y="158" fill="#10b981" font-size="9" font-weight="700" class="font-sans">&#10003; VERIFIED</text>
  </g>

  <!-- BOTTOM BAR: OWNER-ONLY EGRESS MECHANICAL GUARD -->
  <g transform="translate(36, 276)" filter="url(#wfDropShadow)">
    <rect x="0" y="0" width="888" height="106" rx="12" fill="url(#cardEgressGrad)" stroke="#b45309" stroke-width="1.5" />
    
    <!-- Left badge -->
    <rect x="18" y="16" width="170" height="26" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1" />
    <circle cx="30" cy="29" r="4.5" fill="#f59e0b" />
    <text x="42" y="33" fill="#fef3c7" font-size="11" font-weight="700" class="font-mono">OWNER-ONLY EGRESS</text>

    <!-- Details -->
    <g transform="translate(208, 16)">
      <text x="0" y="14" fill="#fef3c7" font-size="12" font-weight="700" class="font-sans">Fail-Closed Pre-Execution Interception</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="11" class="font-sans">
        Intercepts mutating shell actions: <tspan fill="#f59e0b" font-family="monospace">git push</tspan>, <tspan fill="#f59e0b" font-family="monospace">gh release</tspan>, <tspan fill="#f59e0b" font-family="monospace">npm publish</tspan>.
      </text>
      <text x="0" y="48" fill="#94a3b8" font-size="11" class="font-sans">
        Requires <tspan fill="#e2e8f0" font-family="monospace">&lt;run&gt;/outbound/manifest.json</tspan> with fresh SHA256 hashes, claim bearers, and explicit owner approval.
      </text>
      <text x="0" y="64" fill="#f59e0b" font-size="11" font-weight="600" class="font-sans">
        &#9888; Missing manifest, missing approval service, or non-matching tokens deterministically trigger FAIL-CLOSED.
      </text>
    </g>

    <!-- Right badge status -->
    <rect x="748" y="32" width="120" height="42" rx="8" fill="#1c0f05" stroke="#f59e0b" stroke-width="1.2" />
    <text x="764" y="50" fill="#f59e0b" font-size="10" font-weight="700" class="font-mono">EGRESS GUARD</text>
    <text x="770" y="65" fill="#34d399" font-size="11" font-weight="700" class="font-mono">FAIL-CLOSED</text>
  </g>
</svg>
