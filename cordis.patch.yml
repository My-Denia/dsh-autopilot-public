# dsh-autopilot bundle layer: mounts the autopilot plugin with default config.
# Override per profile in the profile's cordis.patch.yml by targeting id: autopilot.
#
# No store pin is needed here: 0.3.0 always keeps one ledger file per session, and the
# retired `storeKind` key is ignored (CHANGELOG, "Retired config keys").
- insert:
    - id: autopilot
      name: dsh-goal-autopilot
