packages:
  - '.'

# The implicit-install gate. pnpm's `verify-deps-before-run` defaults to
# `install`, so `pnpm run <script>` would reach the network whenever the
# lockfile is stale. `warn` keeps the staleness sentence and installs nothing;
# `error` refuses until you install deliberately. The key must be camelCase
# here: pnpm skips hyphenated spellings in the workspace manifest.
verifyDepsBeforeRun: warn
