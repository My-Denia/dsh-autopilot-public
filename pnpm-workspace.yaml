packages:
  - '.'
allowBuilds:
  esbuild: true

# These pre-release versions are younger than the workspace's default release
# age, so pnpm would otherwise refuse to install the exact devDependencies in
# package.json.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.5'
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.5'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.5'
  - '@deepseek-ai/dsh-chunked-list@0.2.2-rc.5'
  - '@deepseek-ai/dsh-fs@0.2.2-rc.5'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.5'
  - '@deepseek-ai/dsh-ptc-runtime@0.2.2-rc.5'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.2-rc.5'
  - '@deepseek-ai/dsh-sandbox@0.2.2-rc.5'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session@0.2.2-rc.5'
  - '@deepseek-ai/dsh-subagent@0.2.2-rc.5'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.5'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.5'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.5'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.5'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-time@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.5'
  - '@deepseek-ai/dsh-working-directory@0.2.2-rc.5'

# The implicit-install gate. pnpm's `verify-deps-before-run` defaults to
# `install`, so `pnpm run <script>` would reach the network whenever the
# lockfile is stale. `warn` keeps the staleness sentence and installs nothing;
# `error` refuses until you install deliberately. The key must be camelCase
# here: pnpm skips hyphenated spellings in the workspace manifest.
verifyDepsBeforeRun: warn