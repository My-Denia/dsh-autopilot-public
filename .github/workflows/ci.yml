# CI for dsh-goal-autopilot.
#
# 0.5.0 is configuration only: a Cordis patch, a skill and documentation. There
# is no plugin code, so the gates are the configuration tests, and `node --test`
# also parses `cordis.patch.yml` as part of them. A separate YAML step would only
# repeat what the suite already fails on.
#
# The gates are invoked directly rather than through `pnpm run <script>` so CI
# runs a fixed command list and does not depend on pnpm's
# verify-deps-before-run behaviour (see pnpm-workspace.yaml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run of the SAME ref stops when a newer push arrives; runs on
# different refs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle (config tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # engines.node is ">=22"; 22 is the floor, so CI runs the floor.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Corepack rather than pnpm/action-setup: package.json already carries
      # `"packageManager": "pnpm@11.17.0"`, and corepack reads exactly that
      # field, so the runner and a developer machine share ONE pin. The
      # corepack bundled with Node 22 predates recent pnpm releases and fails
      # their signature check with "Cannot find matching keyid"; the global
      # update is cheap insurance.
      - name: Enable corepack and activate the pinned pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
          corepack prepare --activate
          pnpm --version

      # --frozen-lockfile: CI must never resolve anything new. A package.json
      # that disagrees with pnpm-lock.yaml is a failure to report, not a
      # condition to fix in place.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test configuration
        run: node --test
