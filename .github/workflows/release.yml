# Tag-triggered release for dsh-goal-autopilot.
#
# npm is the distribution channel: the installable package is published to the
# registry from a maintainer checkout. 0.5.0 is configuration only, so this
# workflow gates the tag on exactly the two commands ci.yml runs on every pull
# request and publishes the GitHub Release NOTES only — no tarball is attached,
# so the registry stays the single source of installable artifacts.
#
# The two verification commands below are BYTE-IDENTICAL to ci.yml's gate
# list, on purpose: a tag must not pass a weaker bar than a pull request.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Gate the tag, then publish notes-only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack and activate the pinned pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test configuration
        run: node --test

      - name: Create the notes-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --notes is documented to PREPEND to --generate-notes output;
          # --notes-file is not documented to combine, so it is not used.
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-goal-autopilot $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat .github/release-notes-preamble.md)"
